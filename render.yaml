# OPTIONAL FREE BACKEND PREVIEW ONLY.
# The recommended portfolio hosting is GitHub Pages, deployed using pages.yml.
# Render Free does NOT provide durable SQLite storage or an always-on scheduler.
services:
  - type: web
    name: northstar-ops-temporary-backend-demo
    runtime: node
    plan: free
    buildCommand: npm run check && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: SQLITE_PATH
        value: /tmp/northstar.sqlite
      - key: ENABLE_SCHEDULER
        value: '0'