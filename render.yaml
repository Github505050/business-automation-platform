# Deploy through Render Blueprint. This configuration uses a paid instance
# and a persistent disk; no charge occurs until you approve it in Render.
services:
  - type: web
    name: northstar-ops
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm run check && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: SQLITE_PATH
        value: /data/northstar.sqlite
      - key: ENABLE_SCHEDULER
        value: '1'
    disk:
      name: northstar-data
      mountPath: /data
      sizeGB: 1
